<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>پاک‌کن کش</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="icons/icon-48.png" alt="" width="22" height="22" />
    <h1>پاک‌کن خودکار کش</h1>
  </header>

  <section class="row">
    <label class="switch">
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </label>
    <div class="row-text">
      <strong>فعال</strong>
      <span class="hint">روشن/خاموش کردن پاکسازی خودکار</span>
    </div>
  </section>

  <section class="field">
    <label for="interval">پاک کردن هر چند ثانیه</label>
    <div class="inline">
      <input type="number" id="interval" min="1" max="600" step="1" />
      <span>ثانیه</span>
    </div>
  </section>

  <section class="row">
    <label class="switch">
      <input type="checkbox" id="clearOnNavigate" />
      <span class="slider"></span>
    </label>
    <div class="row-text">
      <strong>پاکسازی قبل از هر رفرش</strong>
      <span class="hint">هر بار قبل از بارگذاری/رفرش صفحه هم کش پاک شود</span>
    </div>
  </section>

  <section class="row">
    <label class="switch">
      <input type="checkbox" id="extraClear" />
      <span class="slider"></span>
    </label>
    <div class="row-text">
      <strong>پاکسازی عمیق‌تر</strong>
      <span class="hint">کوکی، Local/Session Storage و Service Worker هم پاک شود</span>
    </div>
  </section>

  <button id="clearNow">پاک کردن الان</button>

  <p id="status" class="status"></p>

  <footer>فقط روی این پروفایل فایرفاکس اثر می‌گذارد.</footer>

  <script src="popup.js"></script>
</body>
</html>
